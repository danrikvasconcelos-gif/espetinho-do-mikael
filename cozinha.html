<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Cozinha – Espetinho do Mikael</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
:root{--c:#1c1917;--b:#e4572e;--v:#1f7a4d;--r:#b91c1c;--a:#f5f0e8}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:system-ui,sans-serif;background:var(--a);color:var(--c);padding-bottom:40px}
#login{max-width:340px;margin:14vh auto;padding:20px;display:grid;gap:10px;text-align:center}
header{position:sticky;top:0;z-index:2;background:var(--c);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px}
main{max-width:760px;margin:0 auto;padding:12px}
h2{font-size:1.15rem;margin:14px 0 8px}
.card{background:#fff;border-left:6px solid var(--b);border-radius:8px;padding:14px;margin-bottom:12px}
.card.pr{border-left-color:var(--v);opacity:.8}
.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.it{font-size:1.5rem;padding:5px 0;border-bottom:1px dashed #d6d3d1}
input{font:inherit;padding:12px;border:1px solid #a8a29e;border-radius:6px;min-width:0}
button{font:inherit;padding:12px 16px;border:0;border-radius:6px;background:var(--c);color:#fff;cursor:pointer}
button.ok{width:100%;margin-top:12px;font-size:1.3rem;padding:16px;background:var(--v)}
button.hd{background:#44403c;padding:8px 12px}
button.df{background:#e7e5e4;color:var(--c);padding:6px 10px;margin-left:8px}
small{color:#57534e}
.dim{color:#57534e;text-align:center;margin-top:30px}
</style></head><body>
<div id="login"><img src="/logo.svg" width="84" height="84" alt="Logo" style="justify-self:center;border-radius:18px"><h1>Cozinha</h1><input id="usuario" placeholder="Usuário" autocomplete="username" autocapitalize="none"><input id="senha" type="password" placeholder="Senha" autocomplete="current-password"><button id="entrar" class="ok" style="margin:0">Entrar</button><p id="lerr" style="color:var(--r)"></p></div>
<div id="app" hidden><header><span style="display:flex;align-items:center;gap:8px"><img src="/logo.svg" alt="" width="32" height="32" style="border-radius:8px"><b>Cozinha</b></span><span><button class="hd" id="atu">Atualizar</button> <button class="hd" id="sair">Sair</button></span></header><main id="v"></main></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={novos:[],prontos:[],menu:[]},tok=sessionStorage.ctok||'',mx=null,ac;
const P=id=>S.menu.find(p=>p.id==id)||{nome:'?'};
function bip(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(ac.currentTime+.3)}catch(e){}}
function limpar(){tok='';mx=null;sessionStorage.clear();$('app').hidden=true;$('login').hidden=false}
const api=async b=>{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','x-token':tok},body:JSON.stringify(b)});const j=await r.json();if(!r.ok){if(r.status===401&&tok)limpar();throw new Error(j.erro||'Erro')}return j};
async function load(){const d=await api({a:'cozinha'});const m=Math.max(0,...d.novos.map(x=>x.id));if(mx!==null&&m>mx)bip();mx=Math.max(mx||0,m);S=d;render()}
async function act(b){try{await api(b);await load()}catch(e){alert(e.message)}}
async function entrar(){
 $('lerr').textContent='';
 try{
  if(!tok){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:'login',usuario:$('usuario').value,senha:$('senha').value})});const j=await r.json();if(!r.ok)throw new Error(j.erro||'Erro');tok=j.token;sessionStorage.ctok=tok}
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  await load();$('login').hidden=true;$('app').hidden=false;$('senha').value='';
 }catch(e){tok='';sessionStorage.clear();$('lerr').textContent=e.message;$('app').hidden=true;$('login').hidden=false}
}
$('entrar').onclick=entrar;$('senha').onkeydown=e=>{if(e.key==='Enter')entrar()};
$('atu').onclick=()=>load().catch(e=>alert(e.message));
$('sair').onclick=async()=>{try{await api({a:'logout'})}catch(e){}limpar()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tok&&!$('app').hidden)load().catch(()=>{})});
setInterval(()=>{if(!document.hidden&&tok&&!$('app').hidden)load().catch(()=>{})},20000);
const pronto=id=>act({a:'coz_pronto',id}),desfazer=id=>act({a:'coz_desfazer',id});
const idade=t=>{const m=Math.floor((Date.now()-t.t0)/60000);return m<1?'agora':m+' min'};
const orig=t=>t.origem==='mesa'?`Mesa ${esc(t.mesa)} · ${esc(t.garcom)}`:`WhatsApp #${t.pedido} · ${esc(t.cliente)} (${esc(t.tipo)})`;
const its=t=>Object.entries(t.itens).map(([id,q])=>`<div class="it"><b>${q}×</b> ${esc(P(id).nome)}</div>`).join('');
function render(){
 $('v').innerHTML=`<h2>Aguardando (${S.novos.length})</h2>`
  +(S.novos.map(t=>`<div class="card"><div class="top"><b>${orig(t)}</b><span>${t.ts} · ${idade(t)}</span></div>${its(t)}<button class="ok" onclick="pronto(${t.id})">✓ Pronto</button></div>`).join('')||'<p class="dim">Nenhum pedido para a cozinha agora.</p>')
  +(S.prontos.length?`<details><summary style="margin-top:18px;cursor:pointer"><b>Prontos recentes (${S.prontos.length})</b></summary>`+S.prontos.slice().reverse().map(t=>`<div class="card pr"><div class="top"><b>${orig(t)}</b><span><button class="df" onclick="desfazer(${t.id})">Desfazer</button></span></div>${its(t)}</div>`).join('')+`</details>`:'');
}
if(tok)entrar();
</script></body></html>
